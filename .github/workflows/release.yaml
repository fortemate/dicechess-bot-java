name: "Ops: Release"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: read

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      # Minted first, before the tag, the image or the GitHub Release exist. If
      # the App is not configured the release fails here — cheaply — instead of
      # dying half-done at the version bump, which is the worst place to fail.
      #
      # The App is needed because `main` is protected: the version bump can no
      # longer be pushed straight to `main`, it has to arrive as a pull request,
      # and a pull request opened with the default GITHUB_TOKEN does not get
      # real checks — `pull_request` runs land in an approval-required state and
      # `pull_request_target` runs (`cla-check`, `labeler`) never start at all.
      # An App installation token triggers events normally.
      - name: Mint a token that can open a checked pull request
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Tag push and bump-branch push both go out as the App.
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run validation checks
        run: mvn spotless:check clean test package

      - name: Get latest tag
        id: get_tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump_version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const latestTag = '${{ steps.get_tag.outputs.latest_tag }}';
            const bumpType = '${{ github.event.inputs.bump }}';

            const cleanVersion = latestTag.startsWith('v') ? latestTag.slice(1) : latestTag;
            const match = cleanVersion.match(/^(\d+)\.(\d+)\.(\d+)/);

            let major = 0;
            let minor = 0;
            let patch = 0;

            if (match) {
              major = parseInt(match[1], 10);
              minor = parseInt(match[2], 10);
              patch = parseInt(match[3], 10);
            }

            if (bumpType === 'major') {
              major += 1;
              minor = 0;
              patch = 0;
            } else if (bumpType === 'minor') {
              minor += 1;
              patch = 0;
            } else {
              patch += 1;
            }

            const releaseVersion = `${major}.${minor}.${patch}`;
            const releaseTag = `v${releaseVersion}`;
            const nextSnapshotVersion = `${major}.${minor}.${patch + 1}-SNAPSHOT`;

            core.setOutput('release_version', releaseVersion);
            core.setOutput('release_tag', releaseTag);
            core.setOutput('next_snapshot', nextSnapshotVersion);
            console.log(`Release version: ${releaseVersion} (${releaseTag})`);
            console.log(`Next snapshot: ${nextSnapshotVersion}`);

      - name: Set Release Version in pom.xml
        run: |
          mvn versions:set -DnewVersion=${{ steps.bump_version.outputs.release_version }} -DgenerateBackupPoms=false

      - name: Create and push Git tag
        run: |
          git tag ${{ steps.bump_version.outputs.release_tag }}
          git push origin ${{ steps.bump_version.outputs.release_tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (Versioned & Latest)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:latest
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:${{ steps.bump_version.outputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/dicechess-bot-java:${{ steps.bump_version.outputs.release_version }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --generate-notes \
            --title "$RELEASE_TAG"

      # The bump commit is created at push time, so no status check has ever run
      # on it. Pushed straight to a protected `main` it is rejected with
      # `GH006: Protected branch update failed`, and the release dies after the
      # tag, the image and the GitHub Release already exist. So it goes out on a
      # branch and through a pull request like every other change — nothing
      # writes to `main` unchecked.
      #
      # The tag push above is deliberately left direct: branch rulesets do not
      # apply to tags.
      - name: Open the next-SNAPSHOT version-bump pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEXT_SNAPSHOT: ${{ steps.bump_version.outputs.next_snapshot }}
          RELEASE_TAG: ${{ steps.bump_version.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mvn versions:set -DnewVersion="$NEXT_SNAPSHOT" -DgenerateBackupPoms=false

          # chore/ is intentional: .github/release.yml maps it to no label, so
          # the bump files itself under "Other Changes" rather than inflating a
          # feature section of the next release notes.
          BRANCH="chore/bump-to-$NEXT_SNAPSHOT"
          git switch -c "$BRANCH"
          git add pom.xml
          git commit -m "chore(release): bump version to $NEXT_SNAPSHOT"
          git push origin "$BRANCH"

          gh pr create -R "$REPO" --base main --head "$BRANCH" \
            --title "chore(release): bump version to $NEXT_SNAPSHOT" \
            --body "Post-release bookkeeping for **$RELEASE_TAG**, opened automatically by \`Ops: Release\`.

          Sets the \`pom.xml\` version to \`$NEXT_SNAPSHOT\` so \`main\` carries the next
          development version. Nothing else changes.

          \`$RELEASE_TAG\`, its container image and its GitHub Release are already published —
          this pull request only moves the version forward on \`main\`. Merging it is safe at
          any time; leaving it open only means \`main\` still shows the previous SNAPSHOT."
