name: "CI: Java"

# No path filters, deliberately. `check` is a required status check on `main`,
# and a required check that never starts is not "green" — it is *missing*, which
# blocks the merge forever. A docs-only pull request must still produce `check`,
# so this workflow runs on every pull request. The build takes about a minute;
# that is the price of a gate that is genuinely required.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # SonarQube Cloud needs full history to attribute new code and blame
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Maven build and tests
        run: mvn spotless:check clean test package

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Coverage lives in SonarQube Cloud (JaCoCo XML from the step above).
      #
      # Skipped in two cases, both because SONAR_TOKEN is unavailable and the
      # step would fail the whole required `check` rather than merely skip:
      #   - pull requests from forks, which never receive repository secrets;
      #   - Dependabot pull requests, which receive *Dependabot* secrets rather
      #     than Actions secrets — `github.actor` is the reliable discriminator,
      #     since Dependabot branches live in this repository and therefore pass
      #     the fork test above.
      # Neither loses anything: a dependency bump changes no source, so there is
      # no new code for the quality gate to measure.
      - name: SonarQube Cloud scan
        if: >-
          github.event_name == 'push' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
